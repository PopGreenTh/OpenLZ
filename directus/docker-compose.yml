services:
  postgres:
    image: postgres:16-alpine
    container_name: openlz-directus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "directus"
      POSTGRES_PASSWORD: "directus"
      POSTGRES_DB: "directus"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - openlz-directus-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus -d directus"]
      interval: 5s
      timeout: 5s
      retries: 10

  directus:
    image: directus/directus:latest
    container_name: openlz-directus
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8055:8055"
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
      - ../taxonomy:/directus/taxonomy
    environment:
      SECRET: "openlz-directus-super-secret-key-2026"
      ADMIN_EMAIL: "admin@openlz.io"
      ADMIN_PASSWORD: "admin"
      DB_CLIENT: "pg"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "directus"
      DB_USER: "directus"
      DB_PASSWORD: "directus"
      PUBLIC_URL: "http://localhost:8055/"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"

volumes:
  openlz-directus-pgdata:
