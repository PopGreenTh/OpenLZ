name: weighted-split-adds-up
why: >
  A shared account's cost is split by its App weights. Allocations are ordered by App code and
  the last one takes the remainder, so three equal thirds still add back to the exact amount.
inventory:
  organizations:
    - id: o-cost01
      management_account: "111111111111"
      root_id: r-k001
      ous: []
      accounts:
        - { id: "200000000001", name: shared, status: ACTIVE, parent_id: r-k001 }
        - { id: "200000000002", name: shared-3, status: ACTIVE, parent_id: r-k001 }
taxonomy:
  business_units: [{ code: BU-RETAIL, name: Retail }]
  cost_centers: [{ code: CC-ECOM, name: E-commerce, business_unit: BU-RETAIL }]
  projects: [{ code: PRJ-SHOP, name: Online shop, business_unit: BU-RETAIL }]
  apps:
    - { code: APP-A, name: A, project: PRJ-SHOP, cost_center: CC-ECOM, environments: [{ code: ENV-PROD, name: Production }] }
    - { code: APP-B, name: B, project: PRJ-SHOP, cost_center: CC-ECOM, environments: [{ code: ENV-PROD, name: Production }] }
    - { code: APP-C, name: C, project: PRJ-SHOP, cost_center: CC-ECOM, environments: [{ code: ENV-PROD, name: Production }] }
  lzs: [{ code: LZ-MAIN, name: Main, csp: AWS, currency: USD, management_account: "111111111111" }]
  accounts:
    - account: "200000000001"
      environment: ENV-PROD
      apps: [{ app: APP-A, weight: 3 }, { app: APP-B, weight: 1 }]
    - account: "200000000002"
      environment: ENV-PROD
      apps: [{ app: APP-A }, { app: APP-B }, { app: APP-C }]
cost:
  - { lz: LZ-MAIN, account_id: "200000000001", month: "2026-09", metric: UnblendedCost, amount: 1000.00, currency: USD, estimated: false }
  - { lz: LZ-MAIN, account_id: "200000000002", month: "2026-09", metric: UnblendedCost, amount: 100.00,  currency: USD, estimated: false }
expect:
  allocated:
    - { account_id: "200000000001", app: APP-A, month: "2026-09", amount: 750.00, share: 0.75 }
    - { account_id: "200000000001", app: APP-B, month: "2026-09", amount: 250.00, share: 0.25 }
    - { account_id: "200000000002", app: APP-A, month: "2026-09", amount: 33.33333333333333 }
    - { account_id: "200000000002", app: APP-B, month: "2026-09", amount: 33.33333333333333 }
    - { account_id: "200000000002", app: APP-C, month: "2026-09", amount: 33.33333333333334 }
  findings: []
