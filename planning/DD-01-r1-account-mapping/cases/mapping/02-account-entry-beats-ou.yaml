name: account-entry-beats-ou
why: >
  An account entry is the most specific source. Here it moves one account under the Checkout OU
  to the Payments App and the DR Environment, while its OU still says Checkout and Prod.
inventory:
  organizations:
    - id: o-case02
      management_account: "111111111111"
      root_id: r-c002
      ous:
        - { id: ou-c002-chk00001, name: Checkout, parent_id: r-c002 }
        - { id: ou-c002-chkp0001, name: Prod,     parent_id: ou-c002-chk00001 }
      accounts:
        - { id: "222222222201", name: chk-prod, status: ACTIVE, parent_id: ou-c002-chkp0001 }
        - { id: "222222222203", name: pay-dr,   status: ACTIVE, parent_id: ou-c002-chkp0001 }
taxonomy:
  business_units: [{ code: BU-RETAIL, name: Retail }]
  cost_centers: [{ code: CC-ECOM, name: E-commerce, business_unit: BU-RETAIL }]
  projects: [{ code: PRJ-SHOP, name: Online shop, business_unit: BU-RETAIL }]
  apps:
    - { code: APP-CHK, name: Checkout, project: PRJ-SHOP, cost_center: CC-ECOM,
        environments: [{ code: ENV-PROD, name: Production }] }
    - { code: APP-PAY, name: Payments, project: PRJ-SHOP, cost_center: CC-ECOM,
        environments: [{ code: ENV-PROD, name: Production }, { code: ENV-DR, name: Disaster recovery }] }
  lzs: [{ code: LZ-MAIN, name: Main, csp: AWS, currency: USD, management_account: "111111111111" }]
  ou_links:
    - { ou: /Checkout, app: APP-CHK }
    - { ou: /Checkout/Prod, environment: ENV-PROD }
  accounts:
    - { account: "222222222203", environment: ENV-DR, apps: [{ app: APP-PAY }] }
expect:
  allocations:
    - { account_id: "222222222201", app: APP-CHK, environment: ENV-PROD, share: 1,
        app_rule: "ou:/Checkout", environment_rule: "ou:/Checkout/Prod" }
    - { account_id: "222222222203", app: APP-PAY, environment: ENV-DR, share: 1, share_rule: single,
        app_rule: account, environment_rule: account }
  findings: []
