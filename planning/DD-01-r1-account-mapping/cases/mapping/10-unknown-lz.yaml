name: unknown-lz
why: >
  The organization's management account matches no LZ in the taxonomy, so nothing in it can be
  trusted to map: every account is UNALLOC under LZ-UNALLOC, even where OU links would match.
inventory:
  organizations:
    - id: o-case10
      management_account: "121212121212"
      root_id: r-c010
      ous:
        - { id: ou-c010-chk00001, name: Checkout, parent_id: r-c010 }
        - { id: ou-c010-chkp0001, name: Prod,     parent_id: ou-c010-chk00001 }
      accounts:
        - { id: "101010101001", name: chk-prod, status: ACTIVE, parent_id: ou-c010-chkp0001 }
taxonomy:
  business_units: [{ code: BU-RETAIL, name: Retail }]
  cost_centers: [{ code: CC-ECOM, name: E-commerce, business_unit: BU-RETAIL }]
  projects: [{ code: PRJ-SHOP, name: Online shop, business_unit: BU-RETAIL }]
  apps:
    - { code: APP-CHK, name: Checkout, project: PRJ-SHOP, cost_center: CC-ECOM,
        environments: [{ code: ENV-PROD, name: Production }] }
  lzs: [{ code: LZ-MAIN, name: Main, csp: AWS, currency: USD, management_account: "111111111111" }]
  ou_links:
    - { ou: /Checkout, app: APP-CHK }
    - { ou: /Checkout/Prod, environment: ENV-PROD }
expect:
  allocations:
    - { account_id: "101010101001", lz: LZ-UNALLOC, project: PRJ-UNALLOC, app: APP-UNALLOC, environment: ENV-UNALLOC,
        app_rule: unalloc, environment_rule: unalloc }
  findings:
    - { code: lz-unknown, subject: o-case10 }
