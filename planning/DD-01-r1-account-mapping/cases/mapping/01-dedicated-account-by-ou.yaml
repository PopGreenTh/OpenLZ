name: dedicated-account-by-ou
why: >
  The usual landing-zone layout. The App is linked to its App OU, each environment OU below it
  sets the Environment, and each account is decided by the OUs it sits under.
inventory:
  organizations:
    - id: o-case01
      management_account: "111111111111"
      root_id: r-c001
      ous:
        - { id: ou-c001-chk00001, name: Checkout, parent_id: ou-c001-wkld0001 }
        - { id: ou-c001-chknp001, name: NonProd,  parent_id: ou-c001-chk00001 }
        - { id: ou-c001-chkp0001, name: Prod,     parent_id: ou-c001-chk00001 }
        - { id: ou-c001-wkld0001, name: Workloads, parent_id: r-c001 }
      accounts:
        - { id: "111111111111", name: mgmt,        status: ACTIVE, parent_id: r-c001 }
        - { id: "222222222201", name: chk-prod,    status: ACTIVE, parent_id: ou-c001-chkp0001 }
        - { id: "222222222202", name: chk-nonprod, status: ACTIVE, parent_id: ou-c001-chknp001 }
taxonomy:
  business_units: [{ code: BU-RETAIL, name: Retail }]
  cost_centers: [{ code: CC-ECOM, name: E-commerce, business_unit: BU-RETAIL }]
  projects: [{ code: PRJ-SHOP, name: Online shop, business_unit: BU-RETAIL, lzs: [LZ-MAIN] }]
  apps:
    - code: APP-CHK
      name: Checkout
      project: PRJ-SHOP
      cost_center: CC-ECOM
      environments: [{ code: ENV-PROD, name: Production }, { code: ENV-NONPROD, name: Non-production }]
  lzs: [{ code: LZ-MAIN, name: Main, csp: AWS, currency: USD, management_account: "111111111111" }]
  ou_links:
    - { ou: /Workloads/Checkout, app: APP-CHK }
    - { ou: /Workloads/Checkout/Prod, environment: ENV-PROD }
    - { ou: ou-c001-chknp001, environment: ENV-NONPROD }
expect:
  allocations:
    - { account_id: "111111111111", lz: LZ-MAIN, project: PRJ-UNALLOC, app: APP-UNALLOC, environment: ENV-UNALLOC,
        business_unit: BU-UNALLOC, cost_center: CC-UNALLOC, share: 1, app_rule: unalloc, environment_rule: unalloc }
    - { account_id: "222222222201", lz: LZ-MAIN, ou_path: /Workloads/Checkout/Prod, project: PRJ-SHOP, app: APP-CHK,
        environment: ENV-PROD, business_unit: BU-RETAIL, cost_center: CC-ECOM, share: 1, share_rule: single,
        app_rule: "ou:/Workloads/Checkout", environment_rule: "ou:/Workloads/Checkout/Prod" }
    - { account_id: "222222222202", project: PRJ-SHOP, app: APP-CHK, environment: ENV-NONPROD, share: 1,
        app_rule: "ou:/Workloads/Checkout", environment_rule: "ou:/Workloads/Checkout/NonProd" }
  findings:
    - { code: account-unmapped, subject: "111111111111" }
